version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: kaching
      MYSQL_USER: kaching_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://kaching_user:password123@db:3306/kaching?charset=utf8mb4
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_USER_ID=1
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
