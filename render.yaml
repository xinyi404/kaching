services:
  # FastAPI Backend Service
  - type: web
    name: kaching-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaching-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_USER_ID
        value: "1"

databases:
  # Free Managed PostgreSQL on Render
  - name: kaching-db
    region: singapore
    plan: free
    databaseName: kaching
    user: kaching_user
